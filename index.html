쓰는 끈이나 띠.","공부":"학문이나 기술을 배워서 지식을 얻음.","흥미":"마음을 끌리게 하는 재미.","뇌파":"뇌가 활동할 때 신경들이 내보내는 전류.","잡초":"가꾸지 않아도 저절로 나서 자라는 여러 가지 풀.","바늘":"옷 등을 꿰매거나 만드는 데 쓰는, 쇠로 된 가늘고 끝이 뾰족한 물건.","휴일":"일요일이나 공휴일 등과 같이 일을 하지 않고 쉬는 날.","외투":"점퍼나 코트처럼 추위를 막기 위해 겉에 입는 옷.","사진":"사물의 모습을 오래 보존할 수 있도록 사진기로 찍어 종이나 컴퓨터 등에 나타낸 영상.","차선":"자동차가 다니는 도로에 일정한 너비로 나누어 표시한 선.","지층":"자갈, 모래, 진흙, 화산재 등이 오랜 시간 동안 쌓여 이루어진 층.","학교":"일정한 목적, 교과 과정, 제도 등에 따라 학생을 교육하는 기관.","갈비":"음식의 재료로 쓰이는 소, 돼지, 닭 등의 가슴뼈와 거기에 붙은 살. 또는 그것으로 만든 음식.","도착":"뒤바뀌어 거꾸로 됨.","회로":"전류가 흐르는 통로.","카페":"주로 커피와 차, 가벼운 간식거리 등을 파는 가게.","외모":"사람의 겉으로 보이는 모양.","모레":"내일의 다음 날.","농부":"농사짓는 일을 직업으로 하는 사람.","땜":"구멍이나 틈이 생긴 곳을 다른 것으로 대어 막음.","의자":"사람이 엉덩이와 허벅지를 대고 걸터앉는 데 쓰는 기구.","주중":"일주일 중 주말이 아닌 날.","뿌리":"땅속으로 뻗어서 물과 양분을 빨아올리고 줄기를 지탱하는 식물의 한 부분.","톱니":"톱의 가장자리에 있는 뾰족뾰족한 부분.","천사":"하늘에서 내려와 인간에게 신의 뜻을 전하며 신과 인간을 이어 주는 심부름꾼.","노년":"늙은 나이. 또는 늙은 때.","연주":"악기를 다루어 음악을 들려줌.","감자":"회사가 자산의 손실을 메우거나 실제보다 많게 계산된 자본을 바로잡기 위해 자본금을 줄임.","은하":"흰 구름 모양으로 길게 보이는 수많은 천체의 무리.","며칠":"그달의 몇째 날.","골무":"바느질할 때 바늘을 밀기 위해 손가락에 끼는 도구.","무대":"연극, 무용, 음악 등을 공연하기 위해 객석 앞에 좀 높게 만들어 놓은 넓은 자리.","두뇌":"느끼고 생각하고 행동하고 기억하는 기능을 관리하는 머리뼈 안쪽의 기관.","주걱":"숟가락과 비슷한 모양의 밥을 푸는 도구.","목차":"글이나 책 등에서 여러 제목이나 항목을 순서대로 늘어놓은 목록.","수박":"둥글고 크며 초록 빛깔에 검푸른 줄무늬가 있으며 속이 붉고 수분이 많은 과일.","폐교":"학교의 운영을 그만둠.","그물":"물고기나 짐승을 잡기 위해 끈이나 실, 철사 등으로 짠 도구.","나귀":"말과 비슷하지만 몸이 말보다 작고 귀가 크며 앞머리에 긴 털이 없는 동물.","평소":"특별한 일이 없는 보통 때.","아빠":"격식을 갖추지 않아도 되는 상황에서 아버지를 이르거나 부르는 말.","과자":"밀가루나 쌀가루 등에 우유, 설탕 등을 넣고 반죽하여 굽거나 튀긴 간식.","전구":"전기를 통해 빛을 내는 유리로 된 둥근 기구.","두건":"헝겊이나 천 등으로 만든 머리에 쓰는 물건.","시골":"도시에서 떨어져 있는 지역. 주로 도시보다 인구가 적고 개발이 덜 되어 자연을 접하기 쉽다.","치약":"이를 닦는 데 쓰는 약.","그릇":"음식을 담는 도구.","경주":"사람, 동물, 자동차 등이 정해진 거리를 달려 빠르기를 겨루는 일.","여름":"네 계절 중의 하나로 봄과 가을 사이의 더운 계절.","모래":"자연의 힘으로 잘게 부스러진 돌의 알갱이.","폴더":"컴퓨터에서 관련 있는 파일을 묶어서 하나의 아이콘으로 나타낸 것.","가슴":"인간이나 동물의 목과 배 사이에 있는 몸의 앞 부분.","나팔":"위는 가늘고 길며 끝은 넓게 퍼진 모양의, 입으로 바람을 불어 넣어 소리를 내는 금속의 관악기.","사슴":"눈망울이 크고 털은 갈색이며 다리가 길고 수컷의 머리에는 뿔이 있는 산짐승.","논리":"바르게 판단하고 이치에 맞게 생각하는 과정이나 원리.","하늘":"땅 위로 펼쳐진 무한히 넓은 공간.","귀리":"보리와 비슷하며 거친 식감을 가진 곡물. 주로 밥에 넣어 먹거나, 빵이나 과자 등을 만드는 데에 이용된다.","전파":"전하여 널리 퍼지게 함.","줄기":"식물을 받치고 뿌리에서 빨아들인 수분이나 양분을 나르며, 잎이나 가지, 열매 등이 붙는 부분.","마개":"병 등의 입구나 구멍을 막는 물건.","양파":"모양은 둥글고 매운맛과 특이한 향기가 있는 채소.","까치":"머리에서 등까지는 검고 윤이 나며 어깨와 배는 흰, 사람의 집 근처에 사는 새.","겨울":"네 계절 중의 하나로 가을과 봄 사이의 추운 계절.","주름":"피부가 노화되어 생긴 줄. 또는 잔금.","사탕":"엿이나 설탕을 졸여서 입에 넣기 좋은 크기로 만든 딱딱하고 단 과자.","주판":"수를 계산하는 데에 쓰는, 막대에 구슬들을 꿰어 만든 도구.","가운":"집안의 운수.","너울":"바다의 크고 사나운 물결.","거절":"다른 사람의 부탁이나 제안, 선물 등을 받아들이지 않음.","서핑":"얇고 평평한 판에 올라 파도 위를 넘어가는 놀이.","가발":"진짜 머리카락처럼 만들어 머리에 쓰거나 붙이는 가짜 머리카락.","이름":"다른 것과 구별하기 위해 동물, 사물, 현상 등에 붙여서 부르는 말.","지붕":"집의 윗부분을 덮는 덮개.","기압":"공기의 무게로 인해 생기는 압력.","멸치":"등이 검푸르고 배는 은백색이며 주로 말리거나 젓을 담가 먹는 바닷물고기.","소매":"윗옷의 양 팔을 덮는 부분.","거울":"물체의 모양을 비추어 보는 얇고 평평한 물건.","고목":"오래된 큰 나무.","사과":"자신의 잘못을 인정하며 용서해 달라고 빎.","바람":"어떤 일이 생각한 대로 이루어지기를 원하는 마음.","허물":"살갗에서 저절로 일어나는 얇은 껍질.","초목":"풀과 나무.","차례":"어떤 일을 하거나 어떤 일이 일어나는 순서.","단추":"옷을 여미기 위해 사용하는 작고 동그란 물건.","문어":"붉은 갈색의 둥근 몸통에 빨판이 달린 여덟 개의 발이 아래에 붙어 있는 연체동물.","차창":"기차나 자동차 등에 달린 창문.","각도":"한 점에서 시작된 두 직선이 벌어진 정도.","주인":"대상이나 물건을 자기의 것으로 가진 사람.","담요":"털 등으로 짜서 덮거나 깔도록 만든 얇은 이불.","장미":"줄기에 가시가 있고 오월이나 유월에 향기롭게 피는 빨간색, 하얀색, 노란색 등의 꽃이 피는 나무. 또는 그 꽃.","기회":"어떤 일을 하기에 알맞은 시기나 경우.","주장":"자신의 의견이나 신념을 굳게 내세움. 또는 그런 의견이나 신념.","초성":"언어에서, 음절의 구성에서 처음 소리인 자음.","미움":"미워하는 마음. 또는 미워하는 것.","해녀":"바닷속에 들어가 해삼, 전복, 미역 등을 따는 일을 직업으로 하는 여자.","조끼":"윗옷에 덧입는, 소매가 없는 옷.","취미":"좋아하여 재미로 즐겨서 하는 일.","고래":"몸집이 매우 크며 물고기처럼 생긴, 바다에 사는 동물.","거실":"서양식 집에서, 가족이 모여서 생활하거나 손님을 맞는 중심 공간.","이끼":"잎과 줄기의 구별이 뚜렷하지 않으며 그늘이 지고 습기가 많은 곳의 바위나 나무 등에서 자라는 식물.","하의":"몸의 아래쪽에 입는 옷.","먼지":"공기 중에 날리거나 물건 위에 쌓이는 아주 작고 가벼운 물질.","미련":"매우 어리석고 둔함. 또는 그러한 태도나 행동.","첫차":"그날의 맨 처음 떠나는 차.","종이":"나무를 원료로 하여 얇게 만든, 글씨를 쓰고 그림을 그리고 인쇄를 하는 등 여러 가지 일에 쓰는 물건.","군무":"여러 명이 함께 추는 춤.","망고":"타원형에 과육이 노랗고 부드러우며 단맛이 나는 열대 과일.","한파":"겨울철에 갑자기 기온이 내려가는 것.","자음":"목, 입, 혀 등의 발음 기관에 의해 장애를 받으며 나는 소리.","독사":"이빨에 독이 있는 뱀.","막차":"그날 마지막으로 운행되는 차.","소문":"사람들 사이에 널리 퍼진 말이나 소식.","초봄" const initials = [...'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ'];

function decompose(word) {
  return [...word].flatMap(ch => {
    const n=ch.charCodeAt(0)-0xac00;
    const parts=n>=0&&n<11172 ? [initials[Math.floor(n/588)],vowels[Math.floor(n/28)%21],finals[n%28]] : [ch];
    return parts.flatMap(p=>[...(split[p]||p)]);
  });
}
function score(guess, answer) {
  const result=guess.map((c,i)=>c===answer[i]?'correct':'absent');
  const remaining={};
  answer.forEach((c,i)=>{if(result[i]!=='correct') remaining[c]=(remaining[c]||0)+1;});
  guess.forEach((c,i)=>{if(result[i]!=='correct'&&remaining[c]>0){result[i]='present';remaining[c]--;}});
  return result;
}
function dayKey(date=new Date()) {return new Date(date.getTime()+9*3600000).toISOString().slice(0,10);}
function dayNumber(key) {return Math.floor(Date.parse(key+'T00:00:00Z')/86400000);}
function dailyIndex(key,count,challenge=false) {return ((dayNumber(key)*7919+(challenge?104729:0))>>>0)%count;}

const labels={correct:'위치 일치',present:'다른 위치에 있음',absent:'없음'};
const storageKey='hangul-200-stages-v2';

let dictionary=[],pool=[],lookup=new Map(),stage=1,answer,current=[],guesses=[],ready=false,lastReveal=-1,toastTimer,history={},storageAvailable=true;
try{const stored=localStorage.getItem(storageKey);hasCurrentSave=stored!==null;history=JSON.parse(stored||'{}');if(!history||Array.isArray(history)||typeof history!=='object')history={};}catch{history={};storageAvailable=false;}
function persist(){try{localStorage.setItem(storageKey,JSON.stringify(history));}catch{if(storageAvailable)toast('이 브라우저에서는 기록을 저장할 수 없어요.');storageAvailable=false;}}

function won(){return guesses.some(g=>g.join('')===answer?.jamo.join(''));}

function solved(n){const a=pool[n-1]?.jamo.join('');return history[n]?.guesses?.some(g=>Array.isArray(g)&&g.join('')===a)||false;}

function selectStage(n){
 if(!ready||!Number.isInteger(n)||n<1||n>pool.length)return;
 stage=n;answer=pool[n-1];current=[];guesses=[];lastReveal=-1;
 const saved=history[n];
 if(saved&&Array.isArray(saved.guesses))guesses=saved.guesses.filter(g=>Array.isArray(g)&&g.length===5&&lookup.has(g.join(''))).slice(0,5);
 if(!ended()&&Array.isArray(saved?.current)&&saved.current.length<=5&&saved.current.every(c=>rows.join('').includes(c)&&c!=='←'))current=saved.current;
 history.lastStage=n;persist();render();
}
function render(){
 $('#stage-label').textContent=`Stage ${stage} / ${pool.length}`;
 $('#board').replaceChildren();const keyboardStates={};
 for(let r=0;r<5;r++){

  const letters=guesses[r]||(r===guesses.length?current:[]),states=guesses[r]?score(guesses[r],answer.jamo):[];
  for(let c=0;c<5;c++){

   if(states[c]){tile.classList.add(states[c]);const level={absent:1,present:2,correct:3};if((level[keyboardStates[letters[c]]]||0)<level[states[c]])keyboardStates[letters[c]]=states[c];}
   else if(r===guesses.length&&!ended()){tile.classList.add('active');if(letters[c])tile.classList.add('filled');}
   if(r===lastReveal){tile.classList.add('reveal');tile.style.setProperty('--i',c);}
   tile.setAttribute('aria-label',`${r+1}번째 시도 ${c+1}번째 칸: ${letters[c]||'빈칸'}${states[c]?', '+labels[states[c]]:''}`);row.append(tile);
  }$('#board').append(row);
 }
 $('#keyboard').replaceChildren();
 rows.forEach(letters=>{const row=document.createElement('div');row.className='key-row';[...letters].forEach(letter=>{const key=document.createElement('button');key.className='key '+(keyboardStates[letter]||'');key.textContent=letter;key.setAttribute('aria-label',letter==='←'?'한 칸 지우기':letter+(keyboardStates[letter]?', '+labels[keyboardStates[letter]]:''));key.setAttribute('aria-disabled',String(ended()));key.addEventListener('click',()=>input(letter));row.append(key);});$('#keyboard').append(row);});
 $('#submit').textContent=ended()?'결과보기':'입력하기';$('#submit').setAttribute('aria-disabled',String(!ready));lastReveal=-1;
}
function input(letter){if(!ready||ended())return;if(letter==='←')current.pop();else{const letters=decompose(letter);if(current.length+letters.length>5){toast('자모는 다섯 칸까지 입력할 수 있어요.');return;}current.push(...letters);}save();render();}
function reject(message){toast(message);const row=$('#board').children[guesses.length];row.classList.remove('shake');void row.offsetWidth;row.classList.add('shake');}
function submit(){
 if(!ready)return;if(ended()){showResult();return;}
 if(current.length!==5){reject('자모 다섯 칸을 채워 주세요.');return;}
 if(!lookup.has(current.join(''))){reject('등록된 단어가 아니에요. 다시 조합해 보세요.');return;}
 if(guesses.some(g=>g.join('')===current.join(''))){reject('이미 입력한 단어예요.');return;}
 guesses.push([...current]);current=[];lastReveal=guesses.length-1;save();render();
 if(ended())toast(won()?'정답이에요! 결과를 확인해 보세요.':'다섯 번의 도전이 끝났어요.');
}
function modal(html){$('#dialog-content').innerHTML=html;if(!$('#dialog').open)$('#dialog').showModal();$('#dialog').scrollTop=0;}
function action(id,fn){document.getElementById(id)?.addEventListener('click',fn);}
function showMenu(page=Math.floor((stage-1)/50)){if(!ready)return;if(!Number.isInteger(page)||page<0||page>=Math.ceil(pool.length/50))page=Math.floor((stage-1)/50);const done=pool.filter((_,i)=>solved(i+1)).length;modal(`<h2>스테이지 선택</h2><p class="stage-progress">완료 <b>${done}</b> / ${pool.length} <span>원하는 스테이지를 골라 주세요.</span></p><div class="stage-pages" aria-label="스테이지 구간">${Array.from({length:Math.ceil(pool.length/50)},(_,p)=>`<button data-page="${p}" class="${p===page?'active':''}" aria-pressed="${p===page}">${p*50+1}–${Math.min((p+1)*50,pool.length)}</button>`).join('')}</div><div class="stage-grid">${pool.slice(page*50,(page+1)*50).map((_,i)=>{const n=page*50+i+1,complete=solved(n);return `<button class="stage-button ${complete?'solved':''} ${n===stage?'selected':''}" data-stage="${n}" aria-label="Stage ${n}${complete?', 완료':''}${n===stage?', 현재 선택':''}" ${n===stage?'aria-current="true"':''}>${n}${complete?'<span class="check">✓</span>':''}</button>`;}).join('')}</div><div class="menu-tools"><button id="help">게임 방법</button><button id="type-word">단어로 입력</button></div><p class="fine">카카오톡 화면을 참고한 ${pool.length}단계 재현 게임입니다.<br>진행 상황은 현재 브라우저에 자동 저장됩니다.</p>`);
 document.querySelectorAll('[data-page]').forEach(button=>button.addEventListener('click',()=>showMenu(Number(button.dataset.page))));
 document.querySelectorAll('[data-stage]').forEach(button=>button.addEventListener('click',()=>{selectStage(Number(button.dataset.stage));$('#dialog').close();}));action('help',showHelp);action('type-word',showWordInput);
}
function showHelp(){modal(`<h2>게임 방법</h2><p>자음과 모음 <b>5칸</b>으로 이루어진 단어를 <b>5번</b> 안에 맞혀 보세요.</p><div class="example"><span class="swatch correct">ㄱ</span><span>자모와 위치가 모두 맞아요.</span></div><div class="example"><span class="swatch present">ㄴ</span><span>단어에 있지만 위치가 달라요.</span></div><div class="example"><span class="swatch">ㄷ</span><span>단어에 없거나, 개수를 초과했어요.</span></div><p>사과 → <b>ㅅ ㅏ ㄱ ㅗ ㅏ</b><br>꿩 → <b>ㄱ ㄱ ㅜ ㅓ ㅇ</b><br>포대 → <b>ㅍ ㅗ ㄷ ㅏ ㅣ</b></p><p>쌍자음과 합성 모음도 나눠 입력해요. 같은 자모는 정답에 들어 있는 수만큼만 색이 표시돼요.</p><p>화면 자판 또는 PC 두벌식 자판으로 입력하고 <b>Enter</b>로 제출하세요. 완성된 한글은 더보기의 ‘단어로 입력’을 이용하세요.</p><p><b>…</b>에서 Stage 1~${pool.length}을 자유롭게 선택하세요. 각 스테이지의 단어는 고정되어 있고, 완료한 단계는 초록색으로 표시돼요.</p><p class="fine">입력 사전: ${dictionary.length.toLocaleString()}개 단어. 정답: ${pool.length}개.<br>국립국어원 <a href="https://krdict.korean.go.kr" target="_blank" rel="noopener">한국어기초사전</a> / <a href="https://github.com/basickorean/basickorean-vocab" target="_blank" rel="noopener">basickorean-vocab</a> 데이터를 자모 5칸으로 필터링하고 뜻풀이를 추출했습니다. 데이터는 <a href="https://creativecommons.org/licenses/by-sa/2.0/kr/" target="_blank">CC BY-SA 2.0 KR</a>로 제공되며 <a href="data:application/json;charset=utf-8,${encodeURIComponent(JSON.stringify(WORD_DATA))}" download="words.json">다운로드</a>할 수 있습니다.</p><button class="secondary" id="stages-back">스테이지 선택으로</button>`);action('stages-back',showMenu);}
function showWordInput(){if(ended()){showResult();return;}modal('<h2>단어로 입력하기</h2><p>사과, 하늘처럼 한글로 입력하면<br>다섯 칸의 자모로 나눠 드려요.</p><form id="word-form" class="word-entry"><input id="word" aria-label="한글 단어" placeholder="단어 입력" autocomplete="off" maxlength="8"><button type="submit">채우기</button></form><p id="word-error" role="status"></p>');$('#word').focus();$('#word-form').addEventListener('submit',e=>{e.preventDefault();const value=$('#word').value.trim(),letters=decompose(value);if(!/^[가-힣]+$/.test(value)||letters.length!==5){$('#word-error').textContent='자모로 풀었을 때 5칸인 단어를 입력해 주세요.';return;}if(!lookup.has(letters.join(''))){$('#word-error').textContent='등록된 단어가 아니에요.';return;}current=letters;save();render();$('#dialog').close();});}
function gridText(){return guesses.map(g=>score(g,answer.jamo).map(s=>({correct:'🟩',present:'🟨',absent:'⬜'}[s])).join('')).join('\n');}
function showResult(){if(!ready)return;modal(`<div class="center"><div class="result-date">오늘의 단어 · Stage ${stage} / ${pool.length}</div><h2 style="margin-right:0">${won()?'정답을 찾았어요!':'다시 도전해 보세요'}</h2><div class="answer">${answer.word}</div><p id="definition"></p><p>${won()?`${guesses.length}번째 도전에서 성공했어요.`:'이번 스테이지의 정답이에요.'}</p><div class="share-grid">${gridText()}</div></div><button class="primary" id="next">${stage<pool.length?'다음 스테이지':'스테이지 선택'}</button><button class="secondary" id="share">결과 공유하기</button>${!won()?'<button class="secondary" id="retry">이 스테이지 다시 풀기</button>':''}`);$('#definition').textContent=answer.definition||'';action('next',()=>{if(stage===pool.length){showMenu();return;}selectStage(stage+1);$('#dialog').close();});action('share',share);action('retry',()=>{delete history[stage];selectStage(stage);persist();$('#dialog').close();});}
async function share(){const url=/^https?:$/.test(location.protocol)?location.origin+location.pathname:'';const text=`오늘의 단어 · Stage ${stage}\n${won()?guesses.length:'X'}/5\n\n${gridText()}${url?'\n\n'+url:''}`;try{await navigator.clipboard.writeText(text);$('#share').textContent='결과를 복사했어요 ✓';}catch{if($('#share-text'))return;const area=document.createElement('textarea');area.id='share-text';area.value=text;area.setAttribute('aria-label','공유할 결과');area.style.cssText='width:100%;height:170px;margin-top:14px;border:1px solid #ccc;border-radius:8px;padding:10px';$('#dialog-content').append(area);area.focus();area.select();$('#share').textContent='아래 결과를 복사해 주세요';}}
$('#menu').addEventListener('click',showMenu);$('#back').addEventListener('click',showMenu);$('#submit').addEventListener('click',submit);$('#close').addEventListener('click',()=>$('#dialog').close());$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){const b=$('#dialog').getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)$('#dialog').close();}});
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||$('#dialog').open)return;const key=e.code?.startsWith('Key')?e.code.slice(3).toLowerCase():e.key.toLowerCase();if(e.key==='Enter'){if(document.activeElement?.tagName==='BUTTON'&&document.activeElement.id!=='submit')return;e.preventDefault();submit();}else if(e.key==='Backspace'){e.preventDefault();input('←');}else if(physical[key]){e.preventDefault();const shift={q:'ㅃ',w:'ㅉ',e:'ㄸ',r:'ㄲ',t:'ㅆ',o:'ㅒ',p:'ㅖ'};input(e.shiftKey&&shift[key]||physical[key]);}else if(rows.join('').includes(e.key)&&e.key.length===1){e.preventDefault();input(e.key);}});
function migrateLegacy(legacyAnswers){
 if(hasCurrentSave)return;
 try{
  const legacy=JSON.parse(localStorage.getItem('hangul-50-stages-v1')||'{}');
  for(let i=0;i<legacyAnswers.length;i++){
   const record=legacy[i+1],newIndex=pool.findIndex(a=>a.word===legacyAnswers[i]);
   if(newIndex>=0&&record&&Array.isArray(record.guesses))history[newIndex+1]={guesses:record.guesses,current:Array.isArray(record.current)?record.current:[]};
  }
  const previous=legacyAnswers[legacy.lastStage-1];
  if(previous)history.lastStage=pool.findIndex(a=>a.word===previous)+1;
 }catch{}finally{hasCurrentSave=true;persist();}
}
async function init(){try{const data=WORD_DATA;dictionary=data.words;pool=data.answers.map(word=>({word,jamo:decompose(word),definition:data.definitions[word]}));if(pool.length!==200)throw Error('stage count');lookup=new Map(dictionary.map(w=>[decompose(w).join(''),w]));migrateLegacy(data.legacyAnswers||[]);ready=true;selectStage(Number.isInteger(history.lastStage)&&history.lastStage>=1&&history.lastStage<=pool.length?history.lastStage:1);}catch{$('#submit').textContent='다시 불러오기';$('#submit').onclick=()=>location.reload();toast('단어 목록을 불러오지 못했어요. 다시 시도해 주세요.');}}
init();

})();</script></body></html>
